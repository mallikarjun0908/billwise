# Local run with PostgreSQL:  docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billwise
      POSTGRES_PASSWORD: billwise
      POSTGRES_DB: billwise
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://billwise:billwise@db:5432/billwise
      STORE_UPLOADS: "false"
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
